<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Chess Queen by Keshav Mishra</title>
    <style>
        :root {
            color-scheme: dark;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            --s: min(94vw, calc(100vh - 340px), 600px);
            --lt: #f0d9b5;
            --dk: #b58863;
            --pw: #fff;
            --sw: #2b2b2b;
            --pb: #262626;
            --sb: #e8e8e8;
            background: radial-gradient(circle at 50% 0, #5b3fa8, #1d0f45 70%);
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation
        }

        @supports(height:100dvh) {
            body {
                --s: min(94vw, calc(100dvh - 340px), 600px)
            }
        }

        body[data-th="1"] {
            background: radial-gradient(circle at 50% 0, #ff9800, #6a1b00 75%);
            --lt: #ffe0b2;
            --dk: #e65100
        }

        body[data-th="2"] {
            background: radial-gradient(circle at 50% 0, #ff80ab, #6a1b4d 75%);
            --lt: #fce4ec;
            --dk: #ec407a
        }

        body[data-th="3"] {
            background: radial-gradient(circle at 50% 0, #66bb6a, #0d3b1e 75%);
            --lt: #e8f5e9;
            --dk: #43a047
        }

        body[data-th="4"] {
            background: radial-gradient(circle at 50% 0, #29b6f6, #01283f 75%);
            --lt: #e1f5fe;
            --dk: #0288d1
        }

        body[data-th="5"] {
            background: radial-gradient(circle at 50% 0, #7c4dff, #020014 75%);
            --lt: #b39ddb;
            --dk: #4527a0
        }

        body[data-ps="1"] {
            --pw: #ffd54f;
            --sw: #5d3a00;
            --pb: #3b1d6e;
            --sb: #ffd54f
        }

        .ttl {
            font-weight: 900;
            letter-spacing: 3px;
            font-size: clamp(20px, 4vh, 30px);
            background: linear-gradient(90deg, #ffe082, #ff8a65);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1
        }

        .ttl,
        .card h2 {
            animation: glow 2s infinite alternate
        }

        @keyframes glow {
            to {
                filter: drop-shadow(0 0 10px #ffb300)
            }
        }

        .by {
            font-size: 12px;
            opacity: .75;
            margin-top: -4px;
            letter-spacing: 1px
        }

        .pb {
            display: flex;
            align-items: center;
            gap: 8px;
            width: var(--s);
            box-sizing: border-box;
            padding: 3px 10px;
            border-radius: 14px;
            background: #ffffff18;
            border: 2px solid transparent;
            font-size: 13px;
            opacity: .6;
            transition: .25s;
            min-height: 30px
        }

        .pb.on {
            opacity: 1;
            border-color: #ffd54f;
            box-shadow: 0 0 14px #ffd54f88
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #fff8;
            flex: none
        }

        .tr {
            flex: 1;
            font-size: 16px;
            letter-spacing: -3px;
            white-space: nowrap;
            overflow: hidden
        }

        .tr .w {
            color: #fff
        }

        .tr .b {
            color: #222;
            -webkit-text-stroke: .6px #ddd
        }

        #board {
            position: relative;
            width: var(--s);
            height: var(--s);
            border-radius: 8px;
            box-shadow: 0 12px 40px #000a, 0 0 0 4px #1b1b1b;
            overflow: hidden
        }

        #grid {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template: repeat(8, 1fr)/repeat(8, 1fr)
        }

        .q {
            position: relative;
            background: var(--lt);
            cursor: pointer
        }

        .q.d {
            background: var(--dk)
        }

        .q i {
            position: absolute;
            font-style: normal;
            font-size: calc(var(--s)/42);
            font-weight: 700;
            color: var(--dk);
            opacity: .85
        }

        .q.d i {
            color: var(--lt)
        }

        .q.lm::before,
        .q.sel::before,
        .q.hint::before,
        .q.chk::before {
            content: "";
            position: absolute;
            inset: 0;
            background: #ffeb3b77
        }

        .q.sel::before {
            background: #69f0aeaa
        }

        .q.hint::before {
            background: #40c4ffaa;
            animation: ck .5s infinite alternate
        }

        .q.chk::before {
            background: radial-gradient(circle, #f44336, #f4433600 75%);
            animation: ck .5s infinite alternate
        }

        @keyframes ck {
            to {
                opacity: .4
            }
        }

        .q.mv::after {
            content: "";
            position: absolute;
            inset: 35%;
            border-radius: 50%;
            background: #1b5e20aa;
            animation: dp .7s infinite alternate
        }

        .q.cp::after {
            content: "";
            position: absolute;
            inset: 4%;
            border-radius: 50%;
            border: 4px solid #e53935cc;
            animation: dp .7s infinite alternate
        }

        @keyframes dp {
            to {
                transform: scale(1.18)
            }
        }

        .pc {
            position: absolute;
            width: 12.5%;
            height: 12.5%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--s)/9.4);
            line-height: 1;
            pointer-events: none;
            z-index: 5;
            transition: left .3s cubic-bezier(.3, 1.3, .5, 1), top .3s cubic-bezier(.3, 1.3, .5, 1), transform .2s, opacity .35s
        }

        .pc.w {
            color: var(--pw);
            -webkit-text-stroke: 1.4px var(--sw);
            text-shadow: 0 3px 4px #0009
        }

        .pc.b {
            color: var(--pb);
            -webkit-text-stroke: 1.4px var(--sb);
            text-shadow: 0 3px 4px #0009
        }

        .pc.sel {
            transform: translateY(-12%) scale(1.18);
            z-index: 8
        }

        .pc.cap {
            opacity: 0;
            transform: scale(.2) rotate(50deg)
        }

        .pc.fall {
            transform: rotate(88deg) translateY(10%);
            opacity: .7
        }

        .pc.win {
            animation: wn .6s infinite alternate;
            filter: drop-shadow(0 0 10px gold)
        }

        @keyframes wn {
            to {
                transform: translateY(-10%) scale(1.15)
            }
        }

        #board.shake {
            animation: sh .4s
        }

        @keyframes sh {
            20% {
                transform: translate(-5px, 2px)
            }

            40% {
                transform: translate(5px, -2px)
            }

            60% {
                transform: translate(-3px, -2px)
            }

            80% {
                transform: translate(2px, 2px)
            }
        }

        .pt {
            position: absolute;
            width: 2.2%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: var(--pc);
            pointer-events: none;
            z-index: 50;
            transform: translate(-50%, -50%);
            animation: pt .7s ease-out forwards
        }

        @keyframes pt {
            to {
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0);
                opacity: 0
            }
        }

        .em {
            position: absolute;
            left: 50%;
            font-size: calc(var(--s)/8);
            z-index: 60;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: em 1.7s ease-out forwards
        }

        @keyframes em {
            0% {
                transform: translate(-50%, -50%) scale(.3);
                opacity: 0
            }

            20% {
                transform: translate(-50%, -80%) scale(1.3);
                opacity: 1
            }

            100% {
                transform: translate(-50%, -240%) scale(1);
                opacity: 0
            }
        }

        .em.bub {
            font-size: calc(var(--s)/24);
            background: #fff;
            color: #222;
            padding: 6px 12px;
            border-radius: 14px;
            white-space: nowrap;
            font-weight: 700;
            box-shadow: 0 4px 10px #0007
        }

        .bn {
            position: absolute;
            left: 50%;
            top: 45%;
            z-index: 70;
            pointer-events: none;
            font-weight: 900;
            font-size: calc(var(--s)/7);
            color: #fff;
            text-shadow: 0 0 22px #f44336, 0 4px 0 #b71c1c;
            transform: translate(-50%, -50%);
            animation: bn 1.2s forwards;
            white-space: nowrap
        }

        @keyframes bn {
            0% {
                transform: translate(-50%, -50%) scale(.2);
                opacity: 0
            }

            20% {
                transform: translate(-50%, -50%) scale(1.25);
                opacity: 1
            }

            75% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1
            }

            100% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 0
            }
        }

        #log {
            width: var(--s);
            font-size: 12px;
            white-space: nowrap;
            overflow-x: auto;
            opacity: .85;
            height: 18px;
            scrollbar-width: none
        }

        #log span {
            margin-right: 8px
        }

        #msg {
            font-size: 15px;
            font-weight: 700;
            min-height: 22px;
            text-align: center
        }

        #msg.p {
            animation: mp .35s
        }

        @keyframes mp {
            from {
                transform: scale(.7);
                opacity: 0
            }
        }

        .tl {
            display: flex;
            gap: 8px
        }

        .tl button {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: #ffffff25;
            font-size: 18px;
            color: #fff;
            cursor: pointer
        }

        .tl button:active {
            transform: scale(1.3)
        }

        #chat {
            position: fixed;
            left: 50%;
            bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            width: min(94vw, 420px);
            box-sizing: border-box;
            background: #2a1a6af2;
            border: 1px solid #fff3;
            border-radius: 18px;
            padding: 12px;
            z-index: 90;
            box-shadow: 0 10px 40px #000c;
            display: none;
            max-height: 60vh;
            overflow: auto
        }

        #chat.on {
            display: block;
            animation: cp .25s
        }

        @keyframes cp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px)
            }
        }

        #chat .eg,
        #chat .pg {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center
        }

        #chat .eg button {
            font-size: 24px;
            background: #ffffff1a;
            border: none;
            border-radius: 12px;
            width: 44px;
            height: 44px
        }

        #chat .pg {
            margin-top: 8px
        }

        #chat .pg button {
            background: #ffffff1f;
            border: 1px solid #fff3;
            border-radius: 16px;
            padding: 7px 12px;
            font-size: 13px;
            color: #fff
        }

        .ov {
            position: fixed;
            inset: 0;
            background: #000a;
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100
        }

        .ov.hide {
            display: none
        }

        .card {
            background: linear-gradient(#4a3596, #22145a);
            padding: 24px 22px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 20px 60px #000c, inset 0 1px #fff3;
            width: min(92vw, 360px);
            max-height: 94vh;
            overflow: auto;
            box-sizing: border-box;
            animation: pop .4s cubic-bezier(.2, 1.5, .5, 1)
        }

        @keyframes pop {
            from {
                transform: scale(.6);
                opacity: 0
            }
        }

        .card h2 {
            margin: 0;
            font-size: 30px;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #ffe082, #ff8a65);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .card p {
            margin: 2px 0 8px;
            font-size: 13px;
            opacity: .8
        }

        .card h4 {
            margin: 12px 0 6px;
            font-size: 13px;
            opacity: .8;
            font-weight: 600
        }

        .row {
            display: flex;
            gap: 6px;
            justify-content: center
        }

        .opt {
            flex: 1;
            padding: 9px 2px;
            border-radius: 12px;
            border: 2px solid #fff3;
            background: #ffffff14;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            cursor: pointer
        }

        .opt.sel {
            background: #ffb300;
            border-color: #fff;
            color: #2a1a00
        }

        .go {
            margin-top: 12px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 14px;
            font: inherit;
            font-size: 17px;
            font-weight: 800;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(#69d36e, #2e9e44);
            box-shadow: 0 5px 0 #1b6b2b
        }

        .go:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #1b6b2b
        }

        .go.r {
            background: linear-gradient(#ef5350, #c62828);
            box-shadow: 0 5px 0 #7f1717
        }

        .go.o {
            background: linear-gradient(#ffca28, #f57c00);
            box-shadow: 0 5px 0 #a35200
        }

        #spl {
            z-index: 200;
            background: radial-gradient(circle, #5b3fa8, #12082e);
            flex-direction: column;
            gap: 6px;
            transition: opacity .6s
        }

        #spl.out {
            opacity: 0;
            pointer-events: none
        }

        #spl .big {
            font-size: 76px;
            animation: bob 1.2s ease-in-out infinite alternate
        }

        @keyframes bob {
            to {
                transform: translateY(-14px) rotate(8deg)
            }
        }

        .lb {
            width: 210px;
            height: 8px;
            background: #fff2;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 14px
        }

        .lb i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #ffe082, #ff8a65);
            animation: ld2 1.8s forwards
        }

        @keyframes ld2 {
            from {
                width: 0
            }

            to {
                width: 100%
            }
        }

        .cf {
            position: fixed;
            top: -20px;
            width: 9px;
            height: 15px;
            z-index: 101;
            pointer-events: none;
            animation: fall linear forwards
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg)
            }
        }

        @media (max-height:520px) and (orientation:landscape) {
            body {
                --s: calc(100vh - 16px);
                flex-direction: column;
                flex-wrap: wrap;
                align-content: center;
                gap: 6px 18px
            }

            #board {
                order: -1
            }

            .pb,
            #log {
                width: 250px
            }

            .ttl {
                font-size: 24px
            }
        }

        @media (max-height:520px) and (orientation:landscape) {
            @supports(height:100dvh) {
                body {
                    --s: calc(100dvh - 16px)
                }
            }
        }

        .ad {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            text-align: left;
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 16px;
            background: linear-gradient(120deg, #3949ab, #8e24aa);
            border: 1px solid #fff4;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 18px #0006
        }

        .ad::after {
            content: "";
            position: absolute;
            top: 0;
            left: -60%;
            width: 40%;
            height: 100%;
            background: linear-gradient(100deg, transparent, #fff5, transparent);
            transform: skewX(-20deg);
            animation: sh2 2.6s infinite
        }

        @keyframes sh2 {
            to {
                left: 130%
            }
        }

        .ad .ic {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            flex: none;
            background: conic-gradient(#e53935 0 25%, #2e9e44 0 50%, #f9b600 0 75%, #1e88e5 0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            animation: ab 1.4s ease-in-out infinite alternate
        }

        @keyframes ab {
            to {
                transform: translateY(-4px) rotate(-8deg)
            }
        }

        .ad b {
            display: block;
            font-size: 15px;
            letter-spacing: 1px
        }

        .ad small {
            display: block;
            font-size: 11px;
            opacity: .9;
            line-height: 1.35
        }

        .ad em {
            position: absolute;
            top: 3px;
            right: 8px;
            font-size: 9px;
            font-style: normal;
            opacity: .75;
            border: 1px solid #fff6;
            padding: 0 4px;
            border-radius: 4px
        }

        .ad u {
            margin: 6px 0 0 auto;
            text-decoration: none;
            background: #69d36e;
            color: #10300f;
            font-weight: 800;
            font-size: 12px;
            padding: 7px 11px;
            border-radius: 10px;
            flex: none;
            box-shadow: 0 3px 0 #1b6b2b
        }

        #adc {
            position: fixed;
            left: 14px;
            bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            width: 270px;
            z-index: 30;
            display: none
        }

        @media (min-width:1000px) {
            #adc {
                display: block
            }
        }
    </style>
</head>

<body>
    <div class="ttl">CHESS QUEEN</div>
    <div class="by">by Keshav Mishra</div>
    <div class="pb" id="pt"></div>
    <div id="board">
        <div id="grid"></div>
    </div>
    <div class="pb" id="pbm"></div>
    <div id="log"></div>
    <div id="msg">Welcome!</div>
    <div class="tl" id="emo"><button>😂</button><button>😎</button><button>😭</button><button>👏</button><button
            id="chb">💬</button></div>
    <div class="tl"><button id="th" title="World">🎨</button><button id="ps" title="Piece style">♞</button><button
            id="hn" title="Hint">💡</button><button id="un" title="Undo">↩</button><button id="fl"
            title="Flip board">⇅</button><button id="sn" title="Sound">🔊</button><button id="mn"
            title="Menu">☰</button></div>
    <div id="chat"></div>
    <div id="spl" class="ov">
        <div class="big">♛</div>
        <div class="ttl" style="font-size:40px">CHESS QUEEN</div>
        <div class="by">by Keshav Mishra</div>
        <div class="lb"><i></i></div>
    </div>
    <div id="menu" class="ov">
        <div class="card">
            <h2>CHESS QUEEN</h2>
            <p>by Keshav Mishra</p>
            <h4>Mode</h4>
            <div class="row"><button class="opt" data-g="m" data-v="cpu">vs Computer</button><button class="opt"
                    data-g="m" data-v="pvp">Pass &amp; Play</button></div>
            <h4>Level (vs Computer)</h4>
            <div class="row"><button class="opt" data-g="l" data-v="0">😊 Easy</button><button class="opt" data-g="l"
                    data-v="1">🙂 Medium</button><button class="opt" data-g="l" data-v="2">😈 Hard</button><button
                    class="opt" data-g="l" data-v="3">👑 Pro</button></div>
            <h4>Play as</h4>
            <div class="row"><button class="opt" data-g="s" data-v="w">⚪ White</button><button class="opt" data-g="s"
                    data-v="b">⚫ Black</button><button class="opt" data-g="s" data-v="r">🎲 Random</button></div>
            <h4>Piece Style</h4>
            <div class="row"><button class="opt" data-g="p" data-v="0">⚪ White</button><button class="opt" data-g="p"
                    data-v="1">🟡 Yellow</button></div>
            <button class="go" id="start">▶ START</button>
        </div>
    </div>
    <div id="pz" class="ov hide">
        <div class="card">
            <h2>PAUSED</h2>
            <p>Game is on hold</p><button class="go" id="rs">▶ Resume</button><button class="go o" id="rt">🔄
                Restart</button><button class="go r" id="rg">🏳 Resign</button><button class="go r" id="hm"
                style="background:linear-gradient(#78909c,#455a64);box-shadow:0 5px 0 #263238">🏠 Main Menu</button>
        </div>
    </div>
    <div id="pm" class="ov hide">
        <div class="card">
            <h2 style="font-size:22px">PROMOTE</h2>
            <div class="row" id="pmb" style="margin-top:10px"></div>
        </div>
    </div>
    <div id="end" class="ov hide">
        <div class="card">
            <h2 id="wt">🏆</h2>
            <p id="wd"></p><button class="go" id="again">Play Again</button><button class="go r" id="hm2"
                style="background:linear-gradient(#78909c,#455a64);box-shadow:0 5px 0 #263238">🏠 Main Menu</button>
        </div>
    </div>
    <script>
        const $ = id => document.getElementById(id); let PZ = 0;
